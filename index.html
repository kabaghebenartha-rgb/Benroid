#dlp{position:fixed;right:8px;bottom:calc(66px + env(safe-area-inset-bottom));width:min(340px,calc(100% - 16px));display:flex;flex-direction:column;gap:10px;z-index:260;pointer-events:none}

async function runDownload(url,name,done){
  url=String(url||'').trim();
  if(!/^(https?:|data:|blob:)/.test(url))return toast('No download link');
  let n=name;if(!n){try{n=decodeURIComponent(url.split('?')[0].split('/').pop())}catch(e){}}

  $('.fn',c).textContent=n;$('#dlp').append(c);
  const bar=$('.pb i',c),pc=$('b',c),st=$('small',c);
  const set=p=>{bar.style.width=p+'%';pc.textContent=Math.round(p)+'%'};
  let stored=0;
  try{
    const r=await fetch(url);if(!r.ok)throw 0;
    const total=+r.headers.get('content-length')||0;if(total>250e6||!r.body)throw 0;
    const rd=r.body.getReader(),parts=[];let got=0;st.textContent='Downloading…';
    for(;;){const {done:d,value}=await rd.read();if(d)break;parts.push(value);got+=value.length;set(total?got/total*100:Math.min(90,got/1e5));st.textContent=(got/1048576).toFixed(1)+' MB'+(total?' of '+(total/1048576).toFixed(1)+' MB':'')}

  }catch(e){

    const iv=setInterval(()=>set(p=Math.min(95,p+3+Math.random()*10)),250);
    await new Promise(r=>setTimeout(r,2400));clearInterval(iv);
    saveLink(url,n,true);

  st.textContent='Done. Saved to your device and the Downloads folder.';
  if(!stored)addDownloadFile(n,url);toast('Downloaded '+n);
  if(done)try{done()}catch(e){}
  setTimeout(()=>{c.style.opacity='0';setTimeout(()=>c.remove(),300)},6000);
}

async function infoCard(text){

      title=hit.title;
      const s=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title));

}

function minesApp(b){
  const N=9,M=10;let g,over,first,flag=0;
  const nb=i=>{const x=i%N,y=(i/N)|0,r=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const a=x+dx,c=y+dy;if((dx||dy)&&a>=0&&c>=0&&a<N&&c<N)r.push(c*N+a)}return r};
  const init=()=>{g=Array.from({length:N*N},()=>({m:0,o:0,f:0,n:0}));over=0;first=1;draw()};
  const seed=s=>{let k=0;while(k<M){const i=Math.random()*N*N|0;if(i!==s&&!g[i].m&&!nb(s).includes(i)){g[i].m=1;k++}}g.forEach((c,i)=>c.n=nb(i).filter(j=>g[j].m).length)};
  const open=i=>{const c=g[i];if(c.o||c.f)return;c.o=1;if(c.m){over=1;g.forEach(x=>{if(x.m)x.o=1});return}if(!c.n)nb(i).forEach(open)};
  function draw(){
    const won=!over&&g.every(c=>c.m||c.o);
    b.innerHTML='<div class="bar"><b class="fn">'+(over?'💥 Game over':won?'🎉 You win':'💣 '+M+' mines')+'</b><button class="b" id="mn">New</button><button class="b'+(flag?' pri':'')+'" id="mf">🚩 Flag</button></div><div id="mg2" style="display:grid;grid-template-columns:repeat('+N+',34px);gap:3px;justify-content:center;padding:10px"></div>';
    g.forEach((c,i)=>{const d=el(c.o?(c.m?'💣':c.n||''):c.f?'🚩':'','b');d.style.cssText='height:34px;padding:0;'+(c.o?'opacity:.7':'');d.onclick=()=>{if(over||won)return;if(flag)c.f=!c.f&&!c.o;else{if(first){seed(i);first=0}open(i)}draw()};$('#mg2',b).append(d)});
    $('#mn',b).onclick=init;$('#mf',b).onclick=()=>{flag=!flag;draw()};
  }
  init();
}
function wikiApp(b,w,arg){
  b.innerHTML='<div class="bar"><button class="b" id="wb">←</button><input id="wq" style="flex:1;min-width:120px" placeholder="Search Wikipedia"><button class="b pri" id="wg">Search</button></div><div id="wc" class="wk"></div>';
  const c=$('#wc',b),q=$('#wq',b),API='https://en.wikipedia.org/w/api.php?format=json&origin=*&';let stack=[];
  async function search(t){
    t=(t||'').trim();if(!t)return;q.value=t;stack.push(['s',t]);c.innerHTML='<p class="em">Searching…</p>';w.setTitle('Wikipedia — '+t);
    try{const j=await (await fetch(API+'action=query&list=search&srlimit=12&srsearch='+encodeURIComponent(t))).json();const h=(j.query&&j.query.search)||[];
      c.innerHTML=h.length?h.map(x=>'<div class="ghit wr" data-t="'+esc(x.title)+'"><b>'+esc(x.title)+'</b><div>'+esc(x.snippet.replace(/<[^>]+>/g,''))+'</div></div>').join(''):'<p class="em">No results</p>';
      c.querySelectorAll('.wr').forEach(n=>n.onclick=()=>open(n.dataset.t));
    }catch(e){c.innerHTML='<p class="em">Wikipedia needs an internet connection.</p>'}
  }
  async function open(t){
    stack.push(['a',t]);c.innerHTML='<p class="em">Opening '+esc(t)+'…</p>';
    try{
      const j=await (await fetch(API+'action=parse&prop=text&redirects=1&disableeditsection=1&page='+encodeURIComponent(t))).json();if(!j.parse)throw 0;
      const d=document.createElement('div');d.innerHTML=j.parse.text['*'];
      d.querySelectorAll('script,style,link,iframe,.mw-editsection,.navbox,.reference,.noprint,.mw-empty-elt,.ambox,.sidebar,.hatnote,.metadata').forEach(x=>x.remove());
      d.querySelectorAll('*').forEach(x=>[...x.attributes].forEach(a=>{if(/^on/i.test(a.name))x.removeAttribute(a.name)}));
      d.querySelectorAll('a').forEach(a=>{const m=(a.getAttribute('href')||'').match(/^\/wiki\/([^#:?]+)/);if(m){a.onclick=e=>{e.preventDefault();open(decodeURIComponent(m[1]).replace(/_/g,' '))}}else a.removeAttribute('href')});
      d.querySelectorAll('img').forEach(i=>{const s=i.getAttribute('src')||'';if(s.startsWith('//'))i.src='https:'+s;i.removeAttribute('srcset');i.loading='lazy'});
      c.innerHTML='<h2></h2>';$('h2',c).textContent=j.parse.title;c.append(d);c.scrollTop=0;w.setTitle('Wikipedia — '+j.parse.title);
    }catch(e){c.innerHTML='<p class="em">Could not open that page. Check your internet.</p>'}
  }
  $('#wg',b).onclick=()=>search(q.value);q.onkeydown=e=>{if(e.key==='Enter')search(q.value)};
  $('#wb',b).onclick=()=>{if(stack.length<2)return;stack.pop();const [k,v]=stack.pop();k==='s'?search(v):open(v)};

}

function snakeApp(b,w){
  b.innerHTML='<div class="bar"><b class="sc">Score 0</b></div><canvas width="280" height="280" style="margin:8px auto;background:#101828;touch-action:none"></canvas><div style="display:flex;gap:6px;justify-content:center"><button class="b" data-d="0,-1">Up</button><button class="b" data-d="-1,0">Left</button><button class="b" data-d="0,1">Down</button><button class="b" data-d="1,0">Right</button></div>';
  const cv=$('canvas',b),x=cv.getContext('2d'),N=14,S=20;let sn,dir,nd,food,score,over;
  const place=()=>{do{food={x:0|Math.random()*N,y:0|Math.random()*N}}while(sn.some(s=>s.x===food.x&&s.y===food.y))};
  const init=()=>{sn=[{x:6,y:6},{x:5,y:6}];dir=nd={x:1,y:0};score=0;over=0;place();$('.sc',b).textContent='Score 0'};
  const draw=()=>{x.clearRect(0,0,280,280);x.fillStyle='#e11';x.fillRect(food.x*S+2,food.y*S+2,S-4,S-4);sn.forEach((s,i)=>{x.fillStyle=i?'#4ade80':'#fff';x.fillRect(s.x*S+1,s.y*S+1,S-2,S-2)})};

  const iv=setInterval(tick,150);w.clean.push(()=>clearInterval(iv));init();draw();
}

  settings:'<div class="ico" style="background:linear-gradient(#8a8a8a,#5b5b5b)"><svg viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.7 7.7 0 0 0 .1-2l2-1.2-2-3.4-2.2.6a8 8 0 0 0-1.7-1L15.2 3h-4L10.8 6a8 8 0 0 0-1.7 1L7 6.4l-2 3.4L7 11a7.7 7.7 0 0 0 0 2l-2 1.2 2 3.4 2.2-.6a8 8 0 0 0 1.7 1l.4 3h4l.4-3a8 8 0 0 0 1.7-1l2.2.6 2-3.4z"/></svg></div>',
  terminal:'<div class="ico" style="background:linear-gradient(#2a2a2a,#111)"><svg viewBox="0 0 24 24" fill="#4ade80"><path d="M6 8l4 3-4 3V8zm6 6h6v1.5h-6z"/></svg></div>',
  clock:'<div class="ico" style="background:linear-gradient(#fff,#f0f0f0);border:1px solid #e5e5e5"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="#0078d4" stroke-width="2"/><path stroke="#0078d4" stroke-width="2" d="M12 8v5l3 2"/></svg></div>',
  snake:'<div class="ico" style="background:linear-gradient(#4ade80,#16a34a)"><svg viewBox="0 0 24 24" fill="#fff"><circle cx="8" cy="13" r="2.4"/><circle cx="13" cy="10" r="2.4"/><circle cx="16" cy="15" r="2"/></svg></div>',
  tictac:'<div class="ico" style="background:linear-gradient(#fff,#f3f3f3);border:1px solid #e5e5e5"><svg viewBox="0 0 24 24" stroke="#0078d4" fill="none" stroke-width="2.2"><path d="M7 7l10 10M17 7L7 17"/></svg></div>',
  memory:'<div class="ico" style="background:linear-gradient(#a78bfa,#7c3aed)"><svg viewBox="0 0 24 24" fill="#fff"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></div>',
  start:'<div class="ico" style="background:linear-gradient(#3aa0ff,#0078d4);margin:0;width:22px;height:22px;border-radius:4px"><svg viewBox="0 0 24 24" fill="#fff"><path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/></svg></div>'
};
function iconHtml(id){const a=APPS[id]||downloads[id];return ICONS[id]||'<div class="ico" style="background:#475569"><span style="font-size:22px">'+(a&&a.i||'📦')+'</span></div>'}
function renderIcons(){
  const box=$('#icons');box.innerHTML='';
  installed.forEach(id=>{
    const a=APPS[id]||downloads[id];
    if(!a)return;
    const d=el(iconHtml(id)+'<div>'+esc(a.n)+'</div>','ic');
    d.dataset.id=id;d.onclick=()=>openApp(id);
    box.append(d);
  });
  const dn=node('/Desktop');Object.keys((dn&&dn.c)||{}).forEach(k=>{const f=dn.c[k],d=el('<div class="ico" style="background:#475569"><span style="font-size:22px">'+(f.t==='d'?'📁':'📄')+'</span></div><div>'+esc(k)+'</div>','ic');d.dataset.p='/Desktop/'+k;d.onclick=()=>openFile(d.dataset.p);box.append(d)});
}
function showCtx(e,items){e.preventDefault();const c=$('#ctx');c.innerHTML='';items.forEach(([l,f])=>{const d=el(l);d.onclick=()=>{c.style.display='none';f()};c.append(d)});c.style.display='block';c.style.left=Math.min(e.clientX,innerWidth-200)+'px';c.style.top=Math.max(4,Math.min(e.clientY,innerHeight-items.length*40-60))+'px'}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#ctx'))$('#ctx').style.display='none'});
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&e.key==='Escape'){e.preventDefault();openApp('taskmgr')}});
$('#desk').addEventListener('contextmenu',e=>{
  const ic=e.target.closest('.ic');
  if(ic&&ic.dataset.p){const p=ic.dataset.p;return showCtx(e,[['Open',()=>openFile(p)],['Delete',()=>{rm(p);renderIcons()}]])}
  if(ic){const id=ic.dataset.id,core=['downloads','files','settings','chrome','google','taskmgr','store'].includes(id);return showCtx(e,[['Open',()=>openApp(id)]].concat(core?[]:[['Uninstall',()=>uninstall(id)]]))}
  if(e.target.closest('.win'))return;
  showCtx(e,[['Refresh',renderIcons],['New folder',()=>{mkdir('/Desktop/New folder '+(Date.now()%1000));renderIcons()}],['New text document',()=>{write('/Desktop/New document '+(Date.now()%1000)+'.txt','');renderIcons()}],['Task Manager',()=>openApp('taskmgr')],['Personalize',()=>openApp('settings')]])});
function buildStart(f){const g=$('#sg');g.innerHTML='';installed.forEach(id=>{const a=APPS[id]||downloads[id];if(!a||!a.n.toLowerCase().includes(f||''))return;const d=el(iconHtml(id)+'<div>'+esc(a.n)+'</div>','sa');d.onclick=()=>openApp(id);g.append(d)})}
[['start','start'],['downloads','downloads'],['bektube','bektube'],['google','google'],['github','github'],['chrome','chrome'],['store','store']].forEach(([id,key])=>{const b=document.createElement('button');b.type='button';b.className='ti';b.innerHTML=iconHtml(key);b.onclick=()=>{if(id==='start'){const on=$('#start').classList.toggle('on');if(on){ $('#ss').value='';buildStart('')}}else openApp(id)};$('#center').append(b)});
{const r=document.createElement('span');r.id='run';$('#center').append(r)}
$('#ss').oninput=e=>buildStart(e.target.value.toLowerCase());
$('#sfs').onclick=()=>document.documentElement.requestFullscreen?.();
$('#sinstall').onclick=installSite;
let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});
function installSite(){if(deferred){deferred.prompt();deferred=null;return}toast('Use the browser menu, then Add to Home screen')}
const icon='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#2563eb"/><text x="32" y="42" text-anchor="middle" font-size="32" fill="white">⊞</text></svg>');
const manifest={name:'Bekroid',short_name:'Bekroid',start_url:'./',display:'standalone',background_color:'#050812',theme_color:'#00d9ff',icons:[{src:icon,sizes:'any',type:'image/svg+xml',purpose:'any'}]};
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
$('#srs').onclick=()=>location.reload();
$('#tray').onclick=e=>{e.stopPropagation();$('#quick').classList.toggle('on')};
$('#qtheme').onclick=()=>{cfg.dark=!cfg.dark;saveCfg()};
$('#qset').onclick=()=>openApp('settings');
$('#qbr').oninput=e=>{cfg.bright=+e.target.value;saveCfg()};
function tick(){const d=new Date();const t=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('#hm').textContent=t;$('#dy').textContent=d.toLocaleDateString([],{month:'short',day:'numeric'});const dt=$('#dtime');if(dt){dt.textContent=t;$('#ddate').textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}}
const cur=$('#cursor');
let mouseOn=false, kbOn=false;
let tx=0,ty=0,cx=0,cy=0,raf=0,lt=0;
const place=()=>{cur.style.transform='translate3d('+cx.toFixed(2)+'px,'+cy.toFixed(2)+'px,0)'};
const step=t=>{const dt=Math.min(50,t-(lt||t-16));lt=t;const k=1-Math.exp(-dt/40);cx+=(tx-cx)*k;cy+=(ty-cy)*k;place();if(Math.abs(tx-cx)>.15||Math.abs(ty-cy)>.15)raf=requestAnimationFrame(step);else{cx=tx;cy=ty;place();raf=0;lt=0}};
const aim=e=>{if(!mouseOn)return;tx=e.clientX+2;ty=e.clientY+2;if(!raf)raf=requestAnimationFrame(step)};
document.addEventListener('pointermove',aim,{passive:true});
document.addEventListener('pointerdown',e=>{if(!mouseOn)return;tx=cx=e.clientX+2;ty=cy=e.clientY+2;place()},{passive:true});
$('#ms').onclick=e=>{e.stopPropagation();mouseOn=!mouseOn;cur.classList.toggle('on',mouseOn)};
const rows=[
  ['`','1','2','3','4','5','6','7','8','9','0','-','=','Backspace'],
  ['Tab','q','w','e','r','t','y','u','i','o','p','[',']','\\'],
  ['Caps','a','s','d','f','g','h','j','k','l',';','\'','Enter'],
  ['Shift','z','x','c','v','b','n','m',',','.','/','Shift'],
  ['Ctrl','Alt',' ','Alt','Ctrl']
];
const wide={Backspace:1,Tab:1,Caps:1,Enter:1,Shift:1,Ctrl:1,Alt:1};
$('#osk').innerHTML=rows.map(r=>'<div class="krow">'+r.map(k=>{
  const cls=k===' '?'space':wide[k]?'wide':'';
  const label=k===' '?'':k==='Backspace'?'⌫':k;
  return '<button type="button" class="'+cls+'" data-k="'+k+'">'+label+'</button>';
}).join('')+'</div>').join('');
let shift=false, caps=false, lastField=null;
document.addEventListener('focusin',e=>{if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))lastField=e.target});
$('#kb').onclick=e=>{e.stopPropagation();kbOn=!kbOn;$('#osk').classList.toggle('on',kbOn)};
$('#osk').onpointerdown=e=>e.preventDefault();
$('#osk').onclick=e=>{
  const k=e.target.dataset&&e.target.dataset.k; if(!k)return;
  if(k==='Shift'){shift=!shift;e.target.style.background=shift?'#0078d4':'';return}
  if(k==='Caps'){caps=!caps;e.target.style.background=caps?'#0078d4':'';return}
  if(k==='Ctrl'||k==='Alt'||k==='Tab')return;
  const el=lastField;
  if(!el){toast('Tap a search box or text box first');return}
  el.focus();
  if(k==='Backspace')el.value=el.value.slice(0,-1);
  else if(k==='Enter'){
    el.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}));
  }else{
    let ch=k;
    if(ch.length===1 && (shift||caps) && /[a-z]/.test(ch)) ch=ch.toUpperCase();
    el.value+=ch;
    if(shift)shift=false;
  }
  el.dispatchEvent(new Event('input',{bubbles:true}));
};
applyCfg();tick();setInterval(tick,1000);renderIcons();
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#start')&&!e.target.closest('#quick')&&!e.target.closest('#task')){$('#start').classList.remove('on');$('#quick').classList.remove('on')}});
setTimeout(()=>$('#boot').remove(),800);
</script>
